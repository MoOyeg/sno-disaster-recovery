---
# Deploy a DR demo VirtualMachine via ACM and ArgoCD.
#
# VM analogue of acm-deploy-application.yml (deployapp). Same active/standby DR
# model, but the workload is a Fedora VM (OpenShift Virtualization) whose
# persistent data disk (vm-data-pvc) is replicated by VolSync:
#
#   * The VM (vm/openshift) is scheduled to the ACTIVE cluster only.
#   * The data disk PVC (vm/pvc) is deployed to EVERY SNO cluster.
#   * VolSync source/destination lifecycle is driven by acm-policy-volsync-vm.yaml.
#
# Run:  ./ansible-runner.sh deployvm
#       ./ansible-runner.sh deployvm -e selected_cluster=sno-cluster-01   (non-interactive)
#
# Prerequisites: OpenShift Virtualization (CNV) must be installed on the target
# SNO clusters, and they must be imported into ACM (acmimport) with the operator
# stack deployed (operators). This is an ALTERNATIVE to deployapp - do not run
# both DR stacks at the same time.
- name: Deploy DR demo VirtualMachine via ACM and ArgoCD
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_namespace: "vm-dr-demo"
    policy_namespace: "vm-dr-policies"
    git_repo_url: "https://github.com/MoOyeg/sno-disaster-recovery"
    git_repo_branch: "main"
    vm_git_path: "vm/openshift"
    pvc_git_path: "vm/pvc"
    volsync_key_secret: "volsync-rsync-tls-vm-data-pvc"
    # VolSync ReplicationDestination (standby) and the rsync-tls Service VolSync
    # creates for it; the Service is exported over Submariner so the active
    # cluster's ReplicationSource can reach it via the clusterset address.
    volsync_destination_rd_name: "vm-data-volsync-destination-standby"
    volsync_destination_service: "volsync-rsync-tls-dst-vm-data-volsync-destination-standby"

  tasks:
    - name: Setup authentication parameters for hub cluster
      ansible.builtin.include_role:
        name: sno_prerequisites
        tasks_from: auth_check

    - name: Get all managed clusters
      kubernetes.core.k8s_info:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
      args: "{{ k8s_auth_params }}"
      register: managed_clusters

    - name: Filter SNO clusters (exclude hub)
      ansible.builtin.set_fact:
        sno_cluster_list: "{{ managed_clusters.resources | selectattr('metadata.name', '!=', 'local-cluster') | map(attribute='metadata.name') | list }}"

    - name: Fail if no SNO clusters found
      ansible.builtin.fail:
        msg: "No SNO clusters found. Deploy and import SNO clusters first (deploy / aws-deploy, then acmimport)."
      when: sno_cluster_list | length == 0

    - name: Prompt for VM source (active) cluster
      ansible.builtin.pause:
        prompt: |

          ==========================================
          SELECT VM SOURCE (ACTIVE) CLUSTER
          ==========================================

          Available SNO clusters:
          {% for cluster in sno_cluster_list %}
          {{ loop.index }}. {{ cluster }}
          {% endfor %}

          Which cluster should run the VM (active/primary)?
          Enter cluster name or number [1-{{ sno_cluster_list | length }}]
      register: cluster_selection
      when: selected_cluster is not defined

    - name: Parse cluster selection
      ansible.builtin.set_fact:
        selected_cluster: "{{ sno_cluster_list[cluster_selection.user_input | int - 1] if cluster_selection.user_input | int > 0 and cluster_selection.user_input | int <= sno_cluster_list | length else cluster_selection.user_input }}"
      when: selected_cluster is not defined and cluster_selection.user_input is defined

    - name: Validate cluster selection
      ansible.builtin.fail:
        msg: "Invalid cluster selection: {{ selected_cluster | default('(none)') }}. Select from: {{ sno_cluster_list | join(', ') }}"
      when: selected_cluster not in sno_cluster_list

    - name: Display selected cluster
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "VM active cluster: {{ selected_cluster }}"
          - "Data disk vm-data-pvc replicated to: {{ sno_cluster_list | difference([selected_cluster]) | join(', ') }}"
          - "=========================================="

    - name: Verify ArgoCD is available on hub cluster
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: ArgoCD
        namespace: openshift-gitops
      args: "{{ k8s_auth_params }}"
      register: argocd_check
      failed_when: false

    - name: Fail if ArgoCD is not installed
      ansible.builtin.fail:
        msg: "OpenShift GitOps (ArgoCD) is not installed on hub cluster. Run './ansible-runner.sh operators' first."
      when: argocd_check.resources | length == 0

    - name: Create VM application namespace on hub
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ vm_namespace }}"
        state: present
      args: "{{ k8s_auth_params }}"

    - name: Create Role to read PlacementDecisions in VM namespace
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: Role
        name: gitops-placement-reader
        namespace: "{{ vm_namespace }}"
        state: present
        definition:
          rules:
            - apiGroups: ["cluster.open-cluster-management.io"]
              resources: ["placementdecisions"]
              verbs: ["get", "list", "watch"]
      args: "{{ k8s_auth_params }}"

    - name: Create RoleBinding for GitOps service account
      kubernetes.core.k8s:
        api_version: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        name: gitops-placement-reader
        namespace: "{{ vm_namespace }}"
        state: present
        definition:
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: gitops-placement-reader
          subjects:
            - kind: ServiceAccount
              name: openshift-gitops-argocd-application-controller
              namespace: openshift-gitops
      args: "{{ k8s_auth_params }}"

    - name: Label selected cluster as active
      kubernetes.core.k8s:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ selected_cluster }}"
        state: patched
        definition:
          metadata:
            labels:
              cluster-type: sno
              app-role: active
      args: "{{ k8s_auth_params }}"

    - name: Label other SNO clusters as standby
      kubernetes.core.k8s:
        api_version: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        name: "{{ item }}"
        state: patched
        definition:
          metadata:
            labels:
              cluster-type: sno
              app-role: standby
      args: "{{ k8s_auth_params }}"
      loop: "{{ sno_cluster_list }}"
      when: item != selected_cluster

    - name: Generate VolSync rsync-tls secret value
      ansible.builtin.shell:
        cmd: echo "volsync:$(openssl rand -hex 32)"
      register: volsync_secret_key
      changed_when: false

    - name: Create policy namespace for VM DR
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ policy_namespace }}"
        state: present
      args: "{{ k8s_auth_params }}"

    - name: Create ManagedClusterSetBinding for the VM policy namespace
      kubernetes.core.k8s:
        api_version: cluster.open-cluster-management.io/v1beta2
        kind: ManagedClusterSetBinding
        name: sno-demo
        namespace: "{{ policy_namespace }}"
        state: present
        definition:
          spec:
            clusterSet: sno-demo
      args: "{{ k8s_auth_params }}"

    - name: Create Placement for all SNO clusters (RBAC + secret policies)
      kubernetes.core.k8s:
        api_version: cluster.open-cluster-management.io/v1beta1
        kind: Placement
        name: vm-rbac-placement
        namespace: "{{ policy_namespace }}"
        state: present
        definition:
          spec:
            clusterSets:
              - sno-demo
            predicates:
              - requiredClusterSelector:
                  labelSelector:
                    matchLabels:
                      cluster-type: sno
      args: "{{ k8s_auth_params }}"

    - name: Create Policy for GitOps RBAC on SNO clusters
      kubernetes.core.k8s:
        api_version: policy.open-cluster-management.io/v1
        kind: Policy
        name: vm-gitops-namespace-rbac
        namespace: "{{ policy_namespace }}"
        state: present
        definition:
          metadata:
            annotations:
              policy.open-cluster-management.io/standards: NIST SP 800-53
              policy.open-cluster-management.io/categories: AC Access Control
              policy.open-cluster-management.io/controls: AC-3 Access Enforcement
          spec:
            remediationAction: enforce
            disabled: false
            policy-templates:
              - objectDefinition:
                  apiVersion: policy.open-cluster-management.io/v1
                  kind: ConfigurationPolicy
                  metadata:
                    name: vm-gitops-namespace
                  spec:
                    remediationAction: enforce
                    severity: high
                    object-templates:
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Namespace
                          metadata:
                            name: "{{ vm_namespace }}"
              - objectDefinition:
                  apiVersion: policy.open-cluster-management.io/v1
                  kind: ConfigurationPolicy
                  metadata:
                    name: vm-gitops-admin-role
                  spec:
                    remediationAction: enforce
                    severity: high
                    object-templates:
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: rbac.authorization.k8s.io/v1
                          kind: Role
                          metadata:
                            name: gitops-app-admin
                            namespace: "{{ vm_namespace }}"
                          rules:
                            - apiGroups: ["*"]
                              resources: ["*"]
                              verbs: ["*"]
              - objectDefinition:
                  apiVersion: policy.open-cluster-management.io/v1
                  kind: ConfigurationPolicy
                  metadata:
                    name: vm-gitops-admin-rolebinding
                  spec:
                    remediationAction: enforce
                    severity: high
                    object-templates:
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: rbac.authorization.k8s.io/v1
                          kind: RoleBinding
                          metadata:
                            name: gitops-app-admin
                            namespace: "{{ vm_namespace }}"
                          roleRef:
                            apiGroup: rbac.authorization.k8s.io
                            kind: Role
                            name: gitops-app-admin
                          subjects:
                            - kind: ServiceAccount
                              name: openshift-gitops-argocd-application-controller
                              namespace: openshift-gitops
      args: "{{ k8s_auth_params }}"

    - name: Create PlacementBinding for GitOps RBAC Policy
      kubernetes.core.k8s:
        api_version: policy.open-cluster-management.io/v1
        kind: PlacementBinding
        name: vm-gitops-namespace-rbac-binding
        namespace: "{{ policy_namespace }}"
        state: present
        definition:
          placementRef:
            name: vm-rbac-placement
            apiGroup: cluster.open-cluster-management.io
            kind: Placement
          subjects:
            - name: vm-gitops-namespace-rbac
              apiGroup: policy.open-cluster-management.io
              kind: Policy
      args: "{{ k8s_auth_params }}"

    - name: Create Policy for VolSync rsync-tls Secret on SNO clusters
      kubernetes.core.k8s:
        api_version: policy.open-cluster-management.io/v1
        kind: Policy
        name: vm-volsync-rsync-tls-secret
        namespace: "{{ policy_namespace }}"
        state: present
        definition:
          metadata:
            annotations:
              policy.open-cluster-management.io/standards: NIST SP 800-53
              policy.open-cluster-management.io/categories: SC System and Communications Protection
              policy.open-cluster-management.io/controls: SC-8 Transmission Confidentiality and Integrity
          spec:
            remediationAction: enforce
            disabled: false
            policy-templates:
              - objectDefinition:
                  apiVersion: policy.open-cluster-management.io/v1
                  kind: ConfigurationPolicy
                  metadata:
                    name: vm-volsync-rsync-tls-secret
                  spec:
                    remediationAction: enforce
                    severity: high
                    object-templates:
                      - complianceType: musthave
                        objectDefinition:
                          apiVersion: v1
                          kind: Secret
                          metadata:
                            name: "{{ volsync_key_secret }}"
                            namespace: "{{ vm_namespace }}"
                          type: Opaque
                          stringData:
                            psk.txt: "{{ volsync_secret_key.stdout }}"
      args: "{{ k8s_auth_params }}"

    - name: Create PlacementBinding for VolSync Secret Policy
      kubernetes.core.k8s:
        api_version: policy.open-cluster-management.io/v1
        kind: PlacementBinding
        name: vm-volsync-rsync-tls-secret-binding
        namespace: "{{ policy_namespace }}"
        state: present
        definition:
          placementRef:
            name: vm-rbac-placement
            apiGroup: cluster.open-cluster-management.io
            kind: Placement
          subjects:
            - name: vm-volsync-rsync-tls-secret
              apiGroup: policy.open-cluster-management.io
              kind: Policy
      args: "{{ k8s_auth_params }}"

    - name: Create Placement for all SNO clusters (PVC ApplicationSet)
      kubernetes.core.k8s:
        api_version: cluster.open-cluster-management.io/v1beta1
        kind: Placement
        name: vm-placement-all
        namespace: openshift-gitops
        state: present
        definition:
          spec:
            clusterSets:
              - sno-demo
            predicates:
              - requiredClusterSelector:
                  labelSelector:
                    matchLabels:
                      cluster-type: sno
      args: "{{ k8s_auth_params }}"

    - name: Create ApplicationSet for the DR demo VM (active cluster only)
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: ApplicationSet
        name: fedora-vm-appset
        namespace: openshift-gitops
        state: present
        definition:
          spec:
            generators:
              - clusterDecisionResource:
                  configMapRef: acm-placement
                  labelSelector:
                    matchLabels:
                      cluster.open-cluster-management.io/placement: "vm-placement-active"
                  requeueAfterSeconds: 180
            template:
              metadata:
                labels:
                  app: fedora-dr-vm
                  velero.io/exclude-from-backup: 'true'
                name: "fedora-dr-vm-{{ '{{name}}' }}"
              spec:
                project: default
                sources:
                  - repoURL: "{{ git_repo_url }}"
                    targetRevision: "{{ git_repo_branch }}"
                    path: "{{ vm_git_path }}"
                destination:
                  server: "{{ '{{server}}' }}"
                  namespace: "{{ vm_namespace }}"
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
                  syncOptions:
                    - CreateNamespace=true
                    - PruneLast=true
                  retry:
                    limit: 5
                    backoff:
                      duration: 5s
                      factor: 2
                      maxDuration: 3m
      args: "{{ k8s_auth_params }}"

    - name: Create ApplicationSet for the VM data disk PVC (all clusters)
      kubernetes.core.k8s:
        api_version: argoproj.io/v1alpha1
        kind: ApplicationSet
        name: vm-data-pvc-appset
        namespace: openshift-gitops
        state: present
        definition:
          spec:
            generators:
              - clusterDecisionResource:
                  configMapRef: acm-placement
                  labelSelector:
                    matchLabels:
                      cluster.open-cluster-management.io/placement: "vm-placement-all"
                  requeueAfterSeconds: 180
            template:
              metadata:
                labels:
                  app: fedora-dr-vm
                  velero.io/exclude-from-backup: 'true'
                name: "vm-data-pvc-{{ '{{name}}' }}"
              spec:
                project: default
                sources:
                  - repoURL: "{{ git_repo_url }}"
                    targetRevision: "{{ git_repo_branch }}"
                    path: "{{ pvc_git_path }}"
                destination:
                  server: "{{ '{{server}}' }}"
                  namespace: "{{ vm_namespace }}"
                syncPolicy:
                  automated:
                    prune: true
                    selfHeal: true
                  syncOptions:
                    - CreateNamespace=true
                    - PruneLast=true
                  retry:
                    limit: 5
                    backoff:
                      duration: 5s
                      factor: 2
                      maxDuration: 3m
      args: "{{ k8s_auth_params }}"

    - name: Create ManagedClusterSetBinding for open-cluster-management-global-set
      kubernetes.core.k8s:
        api_version: cluster.open-cluster-management.io/v1beta2
        kind: ManagedClusterSetBinding
        name: sno-demo
        namespace: open-cluster-management-global-set
        state: present
        definition:
          spec:
            clusterSet: sno-demo
      args: "{{ k8s_auth_params }}"

    - name: Create VolSync DR config on hub (storage classes + Submariner address)
      kubernetes.core.k8s:
        api_version: v1
        kind: ConfigMap
        name: volsync-dr-config-vm
        namespace: open-cluster-management-global-set
        state: present
        definition:
          data:
            submarinerEnabled: "{{ ((submariner_enabled | default(true) | bool) and (volsync_use_submariner | default(true) | bool)) | ternary('true', 'false') }}"
            serviceType: "{{ 'ClusterIP' if ((submariner_enabled | default(true) | bool) and (volsync_use_submariner | default(true) | bool)) else 'LoadBalancer' }}"
            storageClassName: "{{ volsync_storage_class }}"
            volumeSnapshotClassName: "{{ volsync_snapshot_class }}"
            address: "{{ volsync_destination_service }}.{{ vm_namespace }}.svc.clusterset.local"
      args: "{{ k8s_auth_params }}"

    - name: Apply VolSync VM Automation ACM Policies
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/acm-policy-volsync-vm.yaml"
      args: "{{ k8s_auth_params }}"

    - name: Wait for VolSync VM policies to be created
      kubernetes.core.k8s_info:
        api_version: policy.open-cluster-management.io/v1
        kind: Policy
        name: "{{ item }}"
        namespace: open-cluster-management-global-set
      args: "{{ k8s_auth_params }}"
      register: vm_policy_status
      until: vm_policy_status.resources | length > 0
      retries: 10
      delay: 5
      loop:
        - vm-vs-source-hub-views
        - vm-vs-dest-info-hub
        - vm-vs-source-active
        - vm-vs-dest-active-del
        - vm-vs-source-standby-del
        - vm-vs-dest-standby

    - name: Export VolSync destination service over Submariner (standby clusters)
      when:
        - submariner_enabled | default(true) | bool
        - volsync_use_submariner | default(true) | bool
      block:
        - name: Create Placement for standby clusters (Submariner ServiceExport)
          kubernetes.core.k8s:
            api_version: cluster.open-cluster-management.io/v1beta1
            kind: Placement
            name: vm-submariner-standby-placement
            namespace: "{{ policy_namespace }}"
            state: present
            definition:
              spec:
                clusterSets:
                  - sno-demo
                predicates:
                  - requiredClusterSelector:
                      labelSelector:
                        matchExpressions:
                          - key: app-role
                            operator: NotIn
                            values:
                              - active
          args: "{{ k8s_auth_params }}"

        - name: Create Policy to export the VolSync destination service
          kubernetes.core.k8s:
            api_version: policy.open-cluster-management.io/v1
            kind: Policy
            name: vm-volsync-submariner-serviceexport
            namespace: "{{ policy_namespace }}"
            state: present
            definition:
              metadata:
                annotations:
                  policy.open-cluster-management.io/standards: NIST SP 800-53
                  policy.open-cluster-management.io/categories: SC System and Communications Protection
                  policy.open-cluster-management.io/controls: SC-7 Boundary Protection
              spec:
                remediationAction: enforce
                disabled: false
                policy-templates:
                  - objectDefinition:
                      apiVersion: policy.open-cluster-management.io/v1
                      kind: ConfigurationPolicy
                      metadata:
                        name: vm-volsync-submariner-serviceexport
                      spec:
                        remediationAction: enforce
                        severity: high
                        object-templates-raw: |
                          {% raw %}{{- $svc := (lookup "v1" "Service" "{% endraw %}{{ vm_namespace }}{% raw %}" "{% endraw %}{{ volsync_destination_service }}{% raw %}") }}
                          {{- if $svc.metadata.name }}
                          - complianceType: musthave
                            objectDefinition:
                              apiVersion: multicluster.x-k8s.io/v1alpha1
                              kind: ServiceExport
                              metadata:
                                name: {% endraw %}{{ volsync_destination_service }}{% raw %}
                                namespace: {% endraw %}{{ vm_namespace }}{% raw %}
                          {{- end }}{% endraw %}
          args: "{{ k8s_auth_params }}"

        - name: Create PlacementBinding for the ServiceExport Policy
          kubernetes.core.k8s:
            api_version: policy.open-cluster-management.io/v1
            kind: PlacementBinding
            name: vm-volsync-submariner-serviceexport-binding
            namespace: "{{ policy_namespace }}"
            state: present
            definition:
              placementRef:
                name: vm-submariner-standby-placement
                apiGroup: cluster.open-cluster-management.io
                kind: Placement
              subjects:
                - name: vm-volsync-submariner-serviceexport
                  apiGroup: policy.open-cluster-management.io
                  kind: Policy
          args: "{{ k8s_auth_params }}"

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "VM DR deployment complete"
          - "=========================================="
          - "VM: fedora-dr-vm  (namespace {{ vm_namespace }})"
          - "Active cluster: {{ selected_cluster }}"
          - "Data disk: vm-data-pvc (replicated by VolSync every 5 min)"
          - ""
          - "ApplicationSets:  fedora-vm-appset (active), vm-data-pvc-appset (all)"
          - "VolSync policies: acm-policy-volsync-vm.yaml (open-cluster-management-global-set)"
          - ""
          - "Verify (active cluster):"
          - "  oc get vmi,replicationsource -n {{ vm_namespace }}"
          - "  virtctl console fedora-dr-vm -n {{ vm_namespace }}   # then: cat /mnt/data/heartbeat.log"
          - ""
          - "Fail over (on the hub):"
          - "  oc label managedcluster <standby> app-role=active  --overwrite"
          - "  oc label managedcluster {{ selected_cluster }} app-role=standby --overwrite"
          - "=========================================="
