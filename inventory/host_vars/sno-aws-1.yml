---
# AWS IPI SNO cluster #1 (primary in the DR pair)
sno_cluster_name: "sno1"

# AWS account selection: named profile in ~/.aws/credentials ([sno1] section).
aws_profile: "default"

# sno_base_domain is auto-discovered from Route53 by deploy-sno-aws.yml.
# Uncomment to pin it explicitly (must be a PUBLIC hosted zone in the account):
# sno_base_domain: "sandbox1208.opentlc.com"

# AWS placement / sizing
aws_region: "us-east-2"
aws_instance_type: "c5n.metal"     # bare metal (72 vCPU/192 GiB) - required for OpenShift Virtualization / VM DR
aws_root_volume_size: 200          # GiB (CNV + containerdisk cache headroom)

# OpenShift release matching the installed openshift-install binary
sno_openshift_version: "4.22.0"

# ACM operator policies: AWS SNO uses the AWS EBS CSI default StorageClass and
# has no MetalLB, so disable the LVM secondary-disk and MetalLB per-cluster
# policies (they only make sense on the on-prem virt clusters). Submariner is
# then selected automatically because MetalLB is not in use (submariner_required).
sno_secondary_disk_device: ""
metallb_ip_address_ranges: []

ansible_connection: local
