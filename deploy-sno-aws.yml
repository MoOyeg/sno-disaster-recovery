---
# Deploy Single Node OpenShift on AWS using the native openshift-install IPI flow.
#
# The installer provisions everything itself (VPC, subnets, security groups, the
# single control-plane EC2 instance, a temporary bootstrap instance, the API/Ingress
# load balancers, and the Route53 records under the base-domain hosted zone).
#
# Requirements (validated below):
#   - openshift-install binary on PATH
#   - AWS credentials (env AWS_ACCESS_KEY_ID/SECRET or AWS_PROFILE, or ~/.aws/credentials)
#   - pull-secret.json and ssh-key.pub in the repo root
#   - sno_base_domain must be a Route53 PUBLIC hosted zone in the target account
#
# Each cluster is described by a host in the [sno_aws_clusters] inventory group with a
# matching host_vars file. Both clusters install concurrently (forks permitting).
- name: Deploy Single Node OpenShift on AWS (IPI)
  hosts: sno_aws_clusters
  gather_facts: false
  serial: "{{ aws_deploy_serial | default(0) }}"   # 0 = all hosts at once; set 1 to serialize
  vars:
    # aws_region / aws_instance_type / aws_root_volume_size come from group_vars
    # (inventory/group_vars/sno_aws_clusters.yml) and may be overridden per host.
    install_dir: "{{ playbook_dir }}/credentials/{{ sno_cluster_name }}"
    artifacts_dir: "{{ playbook_dir }}/artifacts/{{ sno_cluster_name }}"
    sno_pull_secret_file: "{{ playbook_dir }}/pull-secret.json"
    sno_ssh_public_key_file: "{{ playbook_dir }}/ssh-key.pub"
    install_timeout_seconds: 5400   # 90 min ceiling for create cluster

    # Environment applied to every AWS-touching command (Route53 discovery and
    # openshift-install). When this host sets `aws_profile`, AWS_PROFILE selects
    # that account's named profile from ~/.aws/credentials; otherwise the ambient
    # credentials are used. Region is always pinned so the right endpoints/AZs are
    # chosen regardless of the profile's own region setting.
    aws_env: >-
      {{
        (({'AWS_PROFILE': aws_profile} if (aws_profile | default('')) | length > 0 else {})
          | combine({'AWS_REGION': aws_region, 'AWS_DEFAULT_REGION': aws_region}))
      }}

  pre_tasks:
    # Derive the cluster base domain from Route53 unless it was set explicitly
    # (host_vars / group_vars / -e sno_base_domain=...). The base domain must be a
    # PUBLIC Route53 hosted zone in the target account; the installer creates the
    # api/apps records under it.
    - name: Determine base domain from Route53 (when not explicitly set)
      when: (sno_base_domain | default('')) | length == 0
      delegate_to: localhost
      block:
        - name: List Route53 hosted zones
          ansible.builtin.command: aws route53 list-hosted-zones --output json
          environment: "{{ aws_env }}"
          register: _r53_raw
          changed_when: false

        - name: Extract public hosted zone names
          ansible.builtin.set_fact:
            available_hosted_zones: >-
              {{ (_r53_raw.stdout | from_json).HostedZones
                 | rejectattr('Config.PrivateZone')
                 | map(attribute='Name')
                 | map('regex_replace', '[.]$', '') | list }}

        - name: Fail when no public hosted zones exist
          ansible.builtin.fail:
            msg: >-
              No public Route53 hosted zones found in this account. Create one or set
              sno_base_domain explicitly (host_vars or -e sno_base_domain=example.com).
          when: available_hosted_zones | length == 0

        - name: Use the only hosted zone available
          ansible.builtin.set_fact:
            sno_base_domain: "{{ available_hosted_zones[0] }}"
          when: available_hosted_zones | length == 1

        - name: Prompt for hosted zone (multiple available)
          ansible.builtin.pause:
            prompt: |-
              Multiple Route53 public hosted zones found:
              {% for z in available_hosted_zones %}  {{ loop.index }}) {{ z }}
              {% endfor %}
              Enter the number of the base domain to use for {{ inventory_hostname }}
          register: _zone_choice
          when: available_hosted_zones | length > 1

        - name: Set base domain from selection
          ansible.builtin.set_fact:
            sno_base_domain: "{{ available_hosted_zones[(_zone_choice.user_input | int) - 1] }}"
          when:
            - available_hosted_zones | length > 1
            - _zone_choice is not skipped

        - name: Show chosen base domain
          ansible.builtin.debug:
            msg: "Using base domain '{{ sno_base_domain }}' for {{ inventory_hostname }} ({{ sno_cluster_name }})"

  tasks:
    - name: Verify openshift-install is available
      ansible.builtin.command: openshift-install version
      delegate_to: localhost
      changed_when: false
      register: oc_install_version

    - name: Stat AWS shared credentials file
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.aws/credentials"
      register: aws_creds_file
      delegate_to: localhost

    - name: Ensure AWS credentials are available
      ansible.builtin.assert:
        that:
          - ((aws_profile | default('')) | length > 0 and aws_creds_file.stat.exists) or
            (lookup('env', 'AWS_ACCESS_KEY_ID') | length > 0) or
            (lookup('env', 'AWS_PROFILE') | length > 0) or
            aws_creds_file.stat.exists
        fail_msg: >-
          No AWS credentials found for {{ sno_cluster_name }}. Set aws_profile in
          host_vars (a named profile in ~/.aws/credentials), or provide
          AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, AWS_PROFILE, or ~/.aws/credentials.

    - name: Verify the requested AWS named profile exists
      when: (aws_profile | default('')) | length > 0
      delegate_to: localhost
      block:
        - name: Read AWS shared credentials file
          ansible.builtin.slurp:
            src: "{{ lookup('env', 'HOME') }}/.aws/credentials"
          register: _aws_creds_content

        - name: Assert the [{{ aws_profile }}] profile section is present
          ansible.builtin.assert:
            that:
              - "'[' ~ aws_profile ~ ']' in (_aws_creds_content.content | b64decode)"
            fail_msg: >-
              AWS profile '[{{ aws_profile }}]' (required by cluster
              {{ sno_cluster_name }}) was not found in ~/.aws/credentials.
              Add the profile or change aws_profile in host_vars.

    - name: Ensure pull secret exists
      ansible.builtin.stat:
        path: "{{ sno_pull_secret_file }}"
      register: pull_secret_stat
      delegate_to: localhost

    - name: Ensure SSH public key exists
      ansible.builtin.stat:
        path: "{{ sno_ssh_public_key_file }}"
      register: ssh_key_stat
      delegate_to: localhost

    - name: Fail if pull secret or SSH key is missing
      ansible.builtin.assert:
        that:
          - pull_secret_stat.stat.exists
          - ssh_key_stat.stat.exists
        fail_msg: >-
          Missing {{ sno_pull_secret_file }} and/or {{ sno_ssh_public_key_file }}.

    - name: Refuse to clobber an already-deployed cluster
      ansible.builtin.stat:
        path: "{{ install_dir }}/metadata.json"
      register: cluster_metadata
      delegate_to: localhost

    - name: Fail if cluster state already exists
      ansible.builtin.fail:
        msg: >-
          {{ install_dir }}/metadata.json already exists - cluster '{{ sno_cluster_name }}'
          appears to be deployed. Destroy it first with:
          openshift-install destroy cluster --dir {{ install_dir }}
      when: cluster_metadata.stat.exists

    - name: Clean up stale artifacts for this cluster before (re)deploying
      # aws-deploy regenerates every artifact (kubeconfig, kubeadmin-password,
      # install-config, cluster-info). Wipe any leftovers from a previous deploy
      # of this cluster name so a stale kubeconfig can't linger and get picked up
      # by later ACM/oc steps. Scoped to THIS cluster's artifacts_dir so a
      # --limit run never touches other clusters, and it runs only after the
      # clobber guard above - a currently-deployed cluster is never wiped.
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: absent
      delegate_to: localhost

    - name: Create install and artifacts directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ install_dir }}"
        - "{{ artifacts_dir }}"
      delegate_to: localhost

    - name: Render install-config.yaml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/sno_prepare_installation/templates/install-config-aws.yaml.j2"
        dest: "{{ install_dir }}/install-config.yaml"
        mode: '0644'
      delegate_to: localhost

    - name: Back up install-config.yaml (installer consumes the original)
      ansible.builtin.copy:
        src: "{{ install_dir }}/install-config.yaml"
        dest: "{{ artifacts_dir }}/install-config.yaml"
        mode: '0644'
      delegate_to: localhost

    - name: Run openshift-install create cluster (~30-45 min per cluster)
      ansible.builtin.command:
        cmd: "openshift-install create cluster --dir {{ install_dir }} --log-level=info"
        creates: "{{ install_dir }}/auth/kubeconfig"
      environment: "{{ aws_env }}"
      async: "{{ install_timeout_seconds }}"
      poll: 30
      delegate_to: localhost
      register: install_result

    - name: Copy kubeconfig to artifacts
      ansible.builtin.copy:
        src: "{{ install_dir }}/auth/kubeconfig"
        dest: "{{ artifacts_dir }}/kubeconfig"
        mode: '0600'
      delegate_to: localhost

    - name: Copy kubeadmin password to artifacts
      ansible.builtin.copy:
        src: "{{ install_dir }}/auth/kubeadmin-password"
        dest: "{{ artifacts_dir }}/kubeadmin-password"
        mode: '0600'
      delegate_to: localhost

    - name: Read kubeadmin password
      ansible.builtin.slurp:
        src: "{{ install_dir }}/auth/kubeadmin-password"
      register: kubeadmin_pw
      delegate_to: localhost

    - name: Write cluster info file
      ansible.builtin.copy:
        content: |
          Cluster Name: {{ sno_cluster_name }}
          Base Domain:  {{ sno_base_domain }}
          AWS Profile:  {{ ((aws_profile | default('')) | length > 0) | ternary(aws_profile, '(ambient credentials)') }}
          Region:       {{ aws_region }}
          Instance:     {{ aws_instance_type }}
          API URL:      https://api.{{ sno_cluster_name }}.{{ sno_base_domain }}:6443
          Console URL:  https://console-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}
          Kubeconfig:   {{ artifacts_dir }}/kubeconfig
          Kubeadmin:    {{ artifacts_dir }}/kubeadmin-password
        dest: "{{ artifacts_dir }}/cluster-info.txt"
        mode: '0644'
      delegate_to: localhost

    - name: Deployment summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "SNO on AWS deployment complete: {{ sno_cluster_name }}"
          - "Console:  https://console-openshift-console.apps.{{ sno_cluster_name }}.{{ sno_base_domain }}"
          - "API:      https://api.{{ sno_cluster_name }}.{{ sno_base_domain }}:6443"
          - "User:     kubeadmin"
          - "Password: {{ kubeadmin_pw.content | b64decode }}"
          - "Kubeconfig: {{ artifacts_dir }}/kubeconfig"
          - "Destroy with: openshift-install destroy cluster --dir {{ install_dir }}"
          - "=========================================="
